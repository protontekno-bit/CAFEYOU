<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Sistem Karaoke Kafe Dual Screen - CAFEYOU</title>
    <!-- PWA & Standalone Tablet Meta Tags -->
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CAFEYOU" />
    <link rel="manifest" href="/manifest.json" />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Tailwind CSS CDN -->
    <script>
      (function () {
        const _warn = console.warn;
        console.warn = function (...args) {
          if (typeof args[0] === 'string' && args[0].includes('cdn.tailwindcss.com should not be used in production')) {
            return;
          }
          _warn.apply(console, args);
        };
      })();
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', 'ui-sans-serif', 'system-ui', 'sans-serif'],
            },
            keyframes: {
              marquee: {
                '0%': { transform: 'translateX(100%)' },
                '100%': { transform: 'translateX(-100%)' },
              },
              fadeIn: {
                '0%': { opacity: '0', transform: 'scale(0.98)' },
                '100%': { opacity: '1', transform: 'scale(1)' },
              },
              floatUp: {
                '0%': { opacity: '0', transform: 'translateY(50px) scale(0.5)' },
                '15%': { opacity: '1', transform: 'translateY(0px) scale(1.2)' },
                '75%': { opacity: '0.9', transform: 'translateY(-160px) scale(1)' },
                '100%': { opacity: '0', transform: 'translateY(-260px) scale(0.8)' },
              },
              glowPulse: {
                '0%, 100%': { opacity: '0.6', transform: 'scale(1)' },
                '50%': { opacity: '0.9', transform: 'scale(1.03)' },
              },
              waveBar: {
                '0%, 100%': { height: '12%' },
                '50%': { height: '88%' },
              },
              floatOrb: {
                '0%, 100%': { transform: 'translate(0px, 0px) scale(1)' },
                '33%': { transform: 'translate(30px, -40px) scale(1.1)' },
                '66%': { transform: 'translate(-25px, 20px) scale(0.95)' },
              },
            },
            animation: {
              marquee: 'marquee 25s linear infinite',
              fadeIn: 'fadeIn 0.2s ease-out forwards',
              floatUp: 'floatUp 3.2s cubic-bezier(0.22, 1, 0.36, 1) forwards',
              glowPulse: 'glowPulse 4s ease-in-out infinite',
              floatOrb1: 'floatOrb 12s ease-in-out infinite',
              floatOrb2: 'floatOrb 16s ease-in-out infinite reverse',
              floatOrb3: 'floatOrb 14s ease-in-out infinite 2s',
            },
          },
        },
      };
    </script>
    <style>
      body {
        font-family: 'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif;
      }
      .custom-scrollbar::-webkit-scrollbar {
        width: 6px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: rgba(15, 23, 42, 0.6);
        border-radius: 8px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: rgba(51, 65, 85, 0.8);
        border-radius: 8px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background: rgba(100, 116, 139, 1);
      }
    </style>
  </head>
  <body class="bg-slate-950 text-slate-100 min-h-screen antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
